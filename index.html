<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>简课表查看</title>
  <meta name="description" content="免登录秒开的纯静态独立课表 PWA，支持今日视图、周课表、单双周与调停课、离线使用与 .ics 导出。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="简课表">
  <meta id="themeColorMeta" name="theme-color" content="#F6F7F9">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img class="brand-icon" src="./icons/icon.svg" alt="" width="28" height="28">
          <div class="brand-text">
            <span class="brand-title">简课表查看</span>
            <span id="offlineBadge" class="status-pill status-pending">检测离线状态…</span>
          </div>
        </div>

        <nav class="desktop-nav" aria-label="主导航">
          <button type="button" class="nav-btn" data-tab="today">今日</button>
          <button type="button" class="nav-btn" data-tab="week">周课表</button>
          <button type="button" class="nav-btn" data-tab="import">导入与传输</button>
          <button type="button" class="nav-btn" data-tab="settings">设置</button>
        </nav>

        <div class="topbar-actions">
          <button type="button" id="quickAddBtn" class="btn btn-primary btn-sm">+ 记一课</button>
        </div>
      </div>
    </header>

    <div id="updateBanner" class="update-banner hidden" role="alert">
      <span>发现新版本核心资源已缓存完毕，点击更新以避免旧版缓存滞留。</span>
      <button type="button" id="applyUpdateBtn" class="btn btn-primary btn-xs">立即更新刷新</button>
    </div>

    <main id="mainView" class="main-container" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="底部导航">
      <button type="button" class="bottom-nav-btn" data-tab="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8 2v4M16 2v4M3 9h18M9 14l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>今日</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-tab="week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3 9h18M9 9v11M15 9v11" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>周课表</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-tab="import">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 16v2a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>导入</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 .99-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51.99H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true"></div>
  <div id="conflictOverlay" class="modal-overlay hidden" style="z-index: 75;" role="alertdialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
